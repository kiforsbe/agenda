name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, ARM64]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Verify application and tooling
        run: ./scripts/verify.ps1 -Configuration Release -Architecture ${{ matrix.architecture }}
      - name: Build and stage MSI
        env:
          PACKAGE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $ErrorActionPreference = 'Stop'
          $result = & ./scripts/package.ps1 -Format Msi -Architecture $env:PACKAGE_ARCHITECTURE
          $manifest = Get-Content -LiteralPath $result.Manifest -Raw | ConvertFrom-Json
          if ($manifest.Format -ne 'Msi' -or $manifest.Signed -or
              $manifest.SHA256 -ne (Get-FileHash -LiteralPath $result.Artifact -Algorithm SHA256).Hash) {
            throw 'Unexpected MSI artifact metadata.'
          }
          $stage = Join-Path $PWD 'artifacts/ci-msi'
          $null = New-Item -ItemType Directory -Path $stage
          Copy-Item -LiteralPath $result.Artifact -Destination $stage
          Copy-Item -LiteralPath $result.Manifest -Destination $stage
      - name: Verify unsigned opt-in MSIX
        env:
          PACKAGE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $ErrorActionPreference = 'Stop'
          $result = & ./scripts/package.ps1 -Format Msix -Architecture $env:PACKAGE_ARCHITECTURE
          $manifest = Get-Content -LiteralPath $result.Manifest -Raw | ConvertFrom-Json
          if ($manifest.Format -ne 'Msix' -or $manifest.Signed -or
              $manifest.SHA256 -ne (Get-FileHash -LiteralPath $result.Artifact -Algorithm SHA256).Hash) {
            throw 'Expected an inspected unsigned MSIX build artifact.'
          }
      - name: Upload MSI and hash manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Agenda-MSI-${{ matrix.architecture }}-${{ github.run_id }}
          path: artifacts/ci-msi/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
