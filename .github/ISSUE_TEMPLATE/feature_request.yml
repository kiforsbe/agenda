name: Feature request
description: Suggest an improvement to Agenda
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what you want to accomplish. Omit secret calendar links and private event data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
