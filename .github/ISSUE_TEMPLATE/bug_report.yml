name: Bug report
description: Report a reproducible problem with Agenda
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove calendar URLs, account names, event titles, and other private information from screenshots and logs. Use synthetic event data when possible.
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, build 26100
    validations:
      required: true
  - type: input
    id: agenda-version
    attributes:
      label: Agenda commit or version
      placeholder: commit SHA or packaged version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest sequence that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact private calendar data, feed URLs, tokens, and account identifiers before posting.
